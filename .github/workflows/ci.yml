name: CI

on:
  pull_request:
    branches: [dev]
  push:
    branches: [dev]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: ESLint
        run: bun run lint

      - name: TypeScript
        run: bun run typecheck

      - name: Production build
        run: bun run build

      - name: Shopping items tests (Node.js)
        run: node --test tests/shopping-items.test.mjs tests/shopping-draft.test.mjs

      - name: Auto-deduction self-check (Bun)
        run: bun run src/lib/auto-deduction.check.ts
